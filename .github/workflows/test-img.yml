name: Testing images
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version:
          - "29.4"
          - "30.1"
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: make build-test-img
        run: make EMACS=${{ matrix.emacs-version }} ENGINE=docker build-test-img
      - uses: redhat-actions/push-to-registry@v2
        with:
          image: devcontainer-test
          tags: ${{ matrix.emacs-version }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
